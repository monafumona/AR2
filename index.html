<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba AR con model-viewer</title>

  <!-- Cargar model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      padding: 20px;
    }

    model-viewer {
      width: 100%;
      height: 500px;
      background: #222;
    }
  </style>
</head>

<body>

  <h1>Prueba de Realidad Aumentada</h1>

  <model-viewer
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
    alt="Astronauta 3D"
    auto-rotate
    camera-controls
    ar
    ar-modes="scene-viewer quick-look webxr"
    shadow-intensity="1"
  >
  </model-viewer>

  <p>Pulsa el botón de AR en tu móvil para verlo en tu entorno</p>

</body>
</html>
