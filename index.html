<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Test WebXR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }
        model-viewer { width: 100%; height: 100vh; background-color: #111; }
        
        #controls {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); z-index: 10;
        }
        button {
            padding: 15px 25px; border-radius: 30px; border: none;
            background: #007bff; color: white; font-weight: bold;
        }
    </style>
</head>
<body>

    <model-viewer 
        id="ar-model"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
        ar 
        ar-modes="webxr" 
        camera-controls
        ar-placement="floor"
        shadow-intensity="1">
        
        <div id="controls" slot="ar-button">
            <button id="ar-button">ENTRAR EN MODO CÁMARA</button>
        </div>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector("#ar-model");
        let lastTap = 0;

        // Detector de doble toque mejorado para móviles
        modelViewer.addEventListener('touchstart', (event) => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            
            if (tapLength < 300 && tapLength > 0) {
                // ACCIÓN AL DOBLE TOQUE:
                // Reseteamos la escala y posición del objeto
                modelViewer.scale = "1 1 1";
                modelViewer.cameraOrbit = "0deg 75deg 105%";
                modelViewer.cameraTarget = "0m 0m 0m";
                
                alert("Posición reseteada"); 
                event.preventDefault();
            }
            lastTap = currentTime;
        });

        // Intentar que el objeto se "pegue" mejor al detectar el suelo
        modelViewer.addEventListener('ar-status', (event) => {
            if(event.detail.status === 'session-started'){
                console.log("Sesión AR activa. Mueve el móvil para detectar el suelo.");
            }
        });
    </script>
</body>
</html>
