<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba AR con model-viewer</title>

  <!-- Cargar model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: black;
      text-align: center;
    }

    h1 {
      padding: 20px;
      font-size: 60px;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
    }
    p{
      font-size: 40px;
    }
    
    model-viewer::part(ar-button) {
    display: block !important; /* Asegura que se comporte como bloque */
    transform: scale(3.0) !important; /* Hazlo gigante (3 veces su tamaño) */
    transform-origin: bottom right;
    bottom: 50px;
    right: 50px;
  }

    button{
    background-color: #4285F4;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 30px 60px; /* Tamaño del botón */
    font-size: 35px;    /* Tamaño del texto */
    position: absolute;
    bottom: 20px;
    right: 20px;
    z-index: 999;
  "
    }
  </style>
</head>

<body>

  <h1>Michirealidad aumentada</h1>
  <button slot="ar-button">
    VER EN AR
  </button>
  <model-viewer
    src="cat.glb"
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
    alt="Astronauta 3D"
    auto-rotate
    camera-controls
    ar
    ar-modes="scene-viewer quick-look webxr"
    shadow-intensity="1"
  >
  </model-viewer>

  <p>Pulsa el botoncillo ese pa ver al gatico</p>

</body>
</html>
