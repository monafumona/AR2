<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba AR con model-viewer</title>

  <!-- Cargar model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: black;
      text-align: center;
    }

    h1 {
      padding: 20px;
      font-size: 60px;
    }

    model-viewer {
      width: 100%;
      height: 80vh;
    }
    p{
      font-size: 40px;
    }
    
    model-viewer::part(ar-button) {
    /* 1.5 es un 50% más grande, 2.0 sería el doble */
    transform: scale(1.5) !important; 
    
    /* Ajustamos el origen de la transformación para que no se salga de la pantalla */
    transform-origin: bottom right; 
    
    /* Separación del borde (opcional) */
    bottom: 30px;
    right: 30px;
  }
  </style>
</head>

<body>

  <h1>Michirealidad aumentada</h1>

  <model-viewer
    src="cat.glb"
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
    alt="Astronauta 3D"
    auto-rotate
    camera-controls
    ar
    ar-modes="scene-viewer quick-look webxr"
    shadow-intensity="1"
  >
  </model-viewer>

  <p>Pulsa el botoncillo ese pa ver al gatico</p>

</body>
</html>
